version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: archive_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: historical_archive
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d historical_archive"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - archive_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: archive_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/historical_archive
      - DATABASE_SYNC_URL=postgresql://postgres:postgres@postgres:5432/historical_archive
      - STORAGE_BACKEND=local
      - STORAGE_LOCAL_DIR=/app/storage/data
      - AI_PROVIDER=mock
      - EMBEDDING_PROVIDER=mock
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/app/storage/data
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - archive_net

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: archive_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - BACKEND_INTERNAL_URL=http://backend:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - archive_net

volumes:
  pgdata:
    driver: local
  storage_data:
    driver: local

networks:
  archive_net:
    driver: bridge
